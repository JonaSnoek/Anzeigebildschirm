<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{ site_name }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
  <title>{{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/widgets.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/display.css') }}">
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Medien-Ebene (Bilder / Videos) -->
  <div id="player" class="hidden">
    <div id="layer-a" class="layer"></div>
    <div id="layer-b" class="layer"></div>
  </div>

  <!-- Uhr-Ansicht (Leerzustand / Interstitial zwischen den Medien) -->
  <div id="clock-screen" class="clock-screen hidden">
    <div id="clock-screen-block" class="clock-screen-block">
      <span id="clock-big" class="clock-big">--:--:--</span>
      <span id="date-big" class="clock-big-date"></span>
    </div>
  </div>

  <!-- Uhr-Widget während der Medienwiedergabe -->
  <div id="clock-widget" class="widget-clock clock-auto hidden">
    <span class="clock-time"></span>
    <span class="clock-date"></span>
  </div>

  <!-- Wetter-Widget -->
  <div id="weather-widget" class="widget-weather weather-large weather-auto hidden"></div>

  <!-- HTML-Widgets (dynamische Inhalte der Ankündigungsbilder) -->
  <div id="widget-layer" class="widget-layer"></div>

  <!-- Sprachumschalter (Deutsch / Englisch) -->
  <button id="lang-toggle" class="lang-toggle" type="button" title="Sprache wechseln" aria-label="Sprache wechseln">DE</button>

  <!-- Hintergrundmusik -->
  <audio id="bg-audio" loop></audio>

  <script src="{{ url_for('static', filename='js/widgets.js') }}"></script>
  <script src="{{ url_for('static', filename='js/display.js') }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    }
  </script>
</body>
</html>
