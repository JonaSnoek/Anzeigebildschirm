<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/display.css') }}">
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Medien-Ebene (Bilder / Videos) -->
  <div id="player" class="hidden">
    <div id="layer-a" class="layer"></div>
    <div id="layer-b" class="layer"></div>
  </div>

  <!-- Uhr-Ansicht (Leerzustand / Interstitial zwischen den Medien) -->
  <div id="clock-screen" class="hidden">
    <div id="clock-screen-block">
      <div id="clock-big">--:--:--</div>
      <div id="date-big"></div>
    </div>
    <div class="app-name">{{ site_name }}</div>
  </div>

  <!-- Uhr-Widget während der Medienwiedergabe -->
  <div id="clock-widget" class="hidden"></div>

  <!-- Wetter-Widget -->
  <div id="weather-widget" class="hidden"></div>

  <!-- Hintergrundmusik -->
  <audio id="bg-audio" loop></audio>

  <script src="{{ url_for('static', filename='js/display.js') }}"></script>
</body>
</html>
